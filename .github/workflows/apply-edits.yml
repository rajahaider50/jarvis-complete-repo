name: Apply AI edits
on:
  workflow_dispatch:
    inputs:
      file: { description: "Path of the edits JSON you uploaded, e.g. docs/edits/001.json", required: true }
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python tools/apply_edits.py "${{ github.event.inputs.file }}"
      - run: |
          git config user.name "edit-bot"
          git config user.email "edit-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Apply AI edits from ${{ github.event.inputs.file }}" && git push)

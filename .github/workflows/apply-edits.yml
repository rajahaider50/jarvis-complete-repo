name: Apply AI edits
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path of the edits file, e.g. docs/edits/001.json"
        required: true
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_edits.py "${{ github.event.inputs.file }}"
      - name: Commit
        run: |
          git config user.name "edit-bot"
          git config user.email "edit-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Apply AI edits ${{ github.event.inputs.file }}" && git push)

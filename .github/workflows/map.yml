name: Update project map
on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/PROJECT_MAP.md", "docs/.map_state.json"]
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python tools/make_map.py
      - run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add docs/PROJECT_MAP.md docs/.map_state.json
          git diff --cached --quiet || (git commit -m "Update project map [skip ci]" && git push)
